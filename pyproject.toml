[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reperio"
version = "0.1.0.dev0"
description = "Local-first, read-only media discovery and recovery workstation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Reperio contributors" }]

[project.optional-dependencies]
# Developer-quality toolchain, pinned and tracked in docs/dependency-registry.json.
dev = [
  "mypy==1.14.1",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools]
packages = ["api", "hostd", "migrations", "scanner", "shared", "worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["api", "hostd", "migrations", "scanner", "scripts", "shared", "tests", "worker"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]

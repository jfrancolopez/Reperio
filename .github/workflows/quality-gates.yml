name: Repository quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dependency-free repository validation
        run: ./scripts/validate-repository.sh
      - name: Lint GitHub Actions workflows
        run: ./scripts/lint-workflows.sh

  quality-checks:
    name: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned developer quality tools
        run: python3 -m pip install --no-cache-dir -e ".[dev]"
      - name: Formatting check
        run: python3 -m ruff format --check .
      - name: Lint
        run: python3 -m ruff check .
      - name: Type check
        run: python3 -m mypy .
      - name: Unit tests
        run: python3 -m pytest
      - name: Frontend test
        run: python3 scripts/frontend-test.py
      - name: Schema check
        run: python3 scripts/schema-check.py
      - name: Docs check
        run: python3 scripts/docs-check.py
      - name: Aggregate quality target
        run: make quality

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: ./scripts/scan-secrets.sh

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

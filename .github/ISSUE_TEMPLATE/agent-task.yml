name: Agent implementation task
description: Prepare one bounded Reperio backlog task for an implementation agent.
title: "[RPR-NNN] "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per backlog task. Run one implementation agent/task at a time in the authorized single `main` checkout; do not create a parallel worktree or assignment. The packet must work with any capable coding agent/model from repository context. Read `AGENTS.md`, the task in `docs/BACKLOG.md`, and the linked master-plan sections before editing.
  - type: input
    id: task-id
    attributes:
      label: Backlog task ID
      description: Use the exact identifier from docs/BACKLOG.md.
      placeholder: RPR-001
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Copy or faithfully restate the objective from the backlog.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and contracts
      description: List completed dependency IDs and interfaces that must be preserved.
      placeholder: |
        - RPR-NNN
        - Existing schema/API contract
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy every acceptance criterion and make each one independently verifiable.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests
      description: Include happy, hostile/malformed, interruption, and source-write cases when applicable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundaries acknowledged
      options:
        - label: The source device and source files remain read-only.
          required: true
        - label: No discovered content will be executed or given uncontrolled network access.
          required: true
        - label: No secrets, real recovered data, disk images, or personal content will enter Git.
          required: true
        - label: No wallet file, seed, private key, keystore, decrypted vault value, or recovered password will enter logs, notifications, remote AI requests, fixtures, task transcripts, or Git.
          required: true
        - label: Work will remain inside this task and its documented interfaces.
          required: true
        - label: No second implementation agent, task, branch, or worktree will run in parallel.
          required: true
        - label: The task will not depend on a particular coding-agent or LLM vendor/model.
          required: true
